<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sequential architecture" width="100%" viewBox="0 0 1000 710"><title>Sequential architecture</title><rect width="100%" height="100%" rx="18" fill="#fbfcff"/><style>text{font-family:Inter,system-ui,sans-serif}</style><text x="40" y="44" fill="#65758d" font-size="12" text-anchor="start">SeeDL / ARCHITECTURE</text><text x="40" y="80" fill="#20324e" font-size="25" text-anchor="start">Sequential architecture</text><text x="40" y="110" fill="#65758d" font-size="11" text-anchor="start">Sequential data flow · blocks represent operations, not individual neurons.</text><path d="M 52 230 V 245 H 52 V 255" fill="none" stroke="#119b9a" stroke-width="2"/><path d="M 52 330 V 345 H 52 V 355" fill="none" stroke="#119b9a" stroke-width="2"/><path d="M 52 430 V 445 H 52 V 455" fill="none" stroke="#119b9a" stroke-width="2"/><path d="M 52 530 V 545 H 52 V 555" fill="none" stroke="#119b9a" stroke-width="2"/><rect x="40" y="155" width="880" height="76" rx="12" fill="#e8edf5"/><text x="58" y="179" fill="#20324e" font-size="15" text-anchor="start">0 / Conv2d</text><text x="58" y="200" fill="#65758d" font-size="11" text-anchor="start">in_channels=3, out_channels=8, kernel_size=(3, 3), stride=(1, 1), groups=1</text><text x="58" y="218" fill="#65758d" font-size="11" text-anchor="start">Output: (1, 8, 16, 16) · Parameters: 224</text><rect x="40" y="255" width="880" height="76" rx="12" fill="#e8edf5"/><text x="58" y="279" fill="#20324e" font-size="15" text-anchor="start">1 / ReLU</text><text x="58" y="300" fill="#65758d" font-size="11" text-anchor="start"></text><text x="58" y="318" fill="#65758d" font-size="11" text-anchor="start">Output: (1, 8, 16, 16) · Parameters: 0</text><rect x="40" y="355" width="880" height="76" rx="12" fill="#e8edf5"/><text x="58" y="379" fill="#20324e" font-size="15" text-anchor="start">2 / AdaptiveAvgPool2d</text><text x="58" y="400" fill="#65758d" font-size="11" text-anchor="start"></text><text x="58" y="418" fill="#65758d" font-size="11" text-anchor="start">Output: (1, 8, 2, 2) · Parameters: 0</text><rect x="40" y="455" width="880" height="76" rx="12" fill="#e8edf5"/><text x="58" y="479" fill="#20324e" font-size="15" text-anchor="start">3 / Flatten</text><text x="58" y="500" fill="#65758d" font-size="11" text-anchor="start"></text><text x="58" y="518" fill="#65758d" font-size="11" text-anchor="start">Output: (1, 32) · Parameters: 0</text><rect x="40" y="555" width="880" height="76" rx="12" fill="#e8edf5"/><text x="58" y="579" fill="#20324e" font-size="15" text-anchor="start">4 / Linear</text><text x="58" y="600" fill="#65758d" font-size="11" text-anchor="start">in_features=32, out_features=3</text><text x="58" y="618" fill="#65758d" font-size="11" text-anchor="start">Output: (1, 3) · Parameters: 99</text></svg>