[project]
name = "seedl"
version = "0.6.0"
description = "Deep learning tensor exploration (rank, slicing, memory layouts) and quantum computing visualization"
keywords = ["deep-learning", "tensor", "rank", "slicing", "memory-layout", "visualization", "quantum-computing", "pytorch", "numpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
readme = "README.md"
authors = [
    { name = "Aritra Saha", email = "aritrasab@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/iamaritrasaha/seedl"
Issues = "https://github.com/iamaritrasaha/seedl/issues"

[project.optional-dependencies]
torch = ["torch>=2.0"]
numpy = ["numpy>=1.23"]
plotly = ["plotly>=5.18"]
matplotlib = ["matplotlib>=3.7"]
quantum = ["qiskit>=1.0", "numpy>=1.23"]
all = ["torch>=2.0", "numpy>=1.23", "plotly>=5.18", "matplotlib>=3.7", "qiskit>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8", "tomli>=2; python_version < '3.11'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.uv.build-backend]
module-name = "seedl"
module-root = "src"
source-include = ["tests/**", "scripts/verify_release.py", "src/seedl/py.typed", "uv.lock"]
source-exclude = ["**/__pycache__/**", "**/*.pyc", ".git/**", ".venv/**", "work/**", "dist/**", "build/**"]
wheel-exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[build-system]
requires = ["uv_build>=0.12.22,<0.14.0"]
build-backend = "uv_build"
