[project]
name = "seedl"
version = "0.1.0"
description = "A simple, deep-learning-aware visualization library"
readme = "README.md"
authors = [
    { name = "Aritra Saha", email = "aritrasab@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/iamaritrasaha/seedl"
Issues = "https://github.com/iamaritrasaha/seedl/issues"

[project.optional-dependencies]
torch = ["torch>=2.0"]
numpy = ["numpy>=1.23"]
plotly = ["plotly>=5.18"]
matplotlib = ["matplotlib>=3.7"]
all = ["torch>=2.0", "numpy>=1.23", "plotly>=5.18", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.uv.build-backend]
source-include = ["tests/**", "uv.lock"]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
