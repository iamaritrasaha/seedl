name: Official website (manual deployment)

# Publication requires an explicit manual action. No push or release trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
      - name: Install build dependencies (CPU only)
        run: |
          uv venv
          uv pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
          uv pip install 'seedl==0.5.0' 'plotly==7.1.0' 'qiskit==2.5.2'
          .venv/bin/python -c "import seedl; assert seedl.__version__ == '0.5.0', seedl.__version__; print('Website build using installed seedl:', seedl.__file__, seedl.__version__)"
      - name: Generate authentic demonstrations
        run: .venv/bin/python website/generate.py
      - name: Check static links, provenance, and documented examples
        run: .venv/bin/python website/check.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
